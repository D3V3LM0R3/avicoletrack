[project]
name = "avicoletrack-backend"
version = "0.1.0"
description = "AvicoleTrack FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.19.1",
    "argon2-cffi==25.1.0",
    "email-validator==2.3.0",
    "fastapi[standard]==0.141.1",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.4",
    "pydantic-settings==2.15.0",
    "PyJWT==2.13.0",
    "python-multipart==0.0.32",
    "SQLAlchemy==2.0.52",
    "uvicorn[standard]==0.52.0",
]

[tool.setuptools]
packages = ["app"]

[tool.fastapi]
entrypoint = "app.main:app"
